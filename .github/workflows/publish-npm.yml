name: Publish to npm

# A caller into ninoverse/.github, run by hand with a release's tag. The shared
# workflow downloads the tarball release.yml attached to that tag's GitHub
# release and stages it on npmjs.org, so npm serves byte for byte what the
# release holds. A tag makes a release; only this, once approved, makes a
# publish.
#
# Trusted publishing, so no token: npm trades the job's OIDC token for a
# short-lived publish token, and adds provenance. The trusted publisher on
# npmjs.com names this file, not the shared one, because npm checks the
# workflow that started the run.
#
# Staged, so a person releases: the version goes live only once a maintainer
# approves it on npmjs.com, or runs the `npm stage approve` line the run's
# summary gives, behind their second factor. The trusted publisher allows
# staging alone, so a plain publish from here fails with E403.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish, such as v1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Required here, on the calling job: the shared job asks for
    # `id-token: write`, and GitHub refuses to start a called job that asks for
    # more than its caller grants.
    permissions:
      contents: read
      id-token: write
    # Pinned to a released version, not @main or a short @v1: @main lands here
    # with no pull request, and @v1 never moves. Renovate opens the bump.
    uses: ninoverse/.github/.github/workflows/npm-publish.yml@v1.11.0
    with:
      tag: ${{ inputs.tag }}
      registry-url: https://registry.npmjs.org
      stage: true
