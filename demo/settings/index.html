<!doctype html>
<html lang="en" data-theme="default" data-structure="default" data-material="solid">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Alessandra Rossi · Account settings</title>
        <script>
            // The saved theme, before first paint (docs/theming.md).
            try {
                const root = document.documentElement;
                for (const axis of ['theme', 'structure', 'material']) {
                    const saved = localStorage.getItem(`hmi-${axis}`);
                    if (saved) root.setAttribute(`data-${axis}`, saved);
                }
            } catch {
                // Storage is blocked: the attributes keep their defaults.
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Oxanium:wght@200..800&family=Rubik+Glitch&family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&family=Caveat:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <script type="module" src="./main.tsx"></script>
    </head>
    <body>
        <main class="demo-main" id="app"></main>
    </body>
</html>
