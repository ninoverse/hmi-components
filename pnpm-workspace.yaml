# pnpm's settings for this repository. It is a single package, so there is no
# `packages:` list.

# pnpm 10 runs no dependency's install script unless it is allowed. These two
# check that their platform's native binary, which pnpm installs as an optional
# dependency, loads, and fetch a fallback if it does not. The build, both test
# projects and `pnpm cem` pass without them, so they stay off; listing them
# records that choice and stops pnpm warning about it on every install.
ignoredBuiltDependencies:
  - esbuild
  - rs-module-lexer

# Accepted until v6. `pnpm audit` reports 28 advisories under these 22 IDs, all
# in development dependencies: `pnpm audit --prod` finds none, so the published
# package carries none of them. Renovate's monthly lockfile refresh clears them
# all, but it also brings Biome 2.5, whose warnings in the legacy CSS fail lint,
# so it waits for v6, which deletes that CSS. Remove this list with that
# refresh. An advisory not listed here still fails the audit.
auditConfig:
  ignoreGhsas:
    - GHSA-w5vr-8v7q-w6rv # baseline-browser-mapping
    - GHSA-3jxr-9vmj-r5cp # brace-expansion
    - GHSA-6j4f-fj2g-mc7p # brace-expansion
