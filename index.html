<!doctype html>
<html lang="en" data-theme="default" data-structure="default" data-material="solid">
    <head>
        <meta charset="UTF-8" />
        <script>
            // Apply the saved theme + structure before first paint (no flash).
            try {
                var el = document.documentElement;
                var t = localStorage.getItem('hmi-theme');
                var s = localStorage.getItem('hmi-structure');
                var m = localStorage.getItem('hmi-material');
                if (t) el.setAttribute('data-theme', t);
                if (s) el.setAttribute('data-structure', s);
                if (m) el.setAttribute('data-material', m);
            } catch (e) {
                /* localStorage unavailable — fall back to default attributes */
            }
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ninoverse HMI Components</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Oxanium:wght@200..800&family=Rubik+Glitch&family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&family=Caveat:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/themes/constants.css" />
        <link rel="stylesheet" href="/css/themes/color/default.css" />
        <link rel="stylesheet" href="/css/themes/color/ocean.css" />
        <link rel="stylesheet" href="/css/themes/color/forest.css" />
        <link rel="stylesheet" href="/css/themes/structure/default.css" />
        <link rel="stylesheet" href="/css/themes/structure/rounded.css" />
        <link rel="stylesheet" href="/css/themes/structure/sharp.css" />
        <link rel="stylesheet" href="/css/themes/structure/pixel.css" />
        <link rel="stylesheet" href="/css/themes/structure/journal.css" />
        <link rel="stylesheet" href="/css/themes/material/glass.css" />
        <link rel="stylesheet" href="/css/themes/material/liquid.css" />
    </head>
    <body>
        <!-- Refraction filter for the 'liquid' material (data-material="liquid").
             Same-document so backdrop-filter: url(#liquid-glass) resolves reliably. -->
        <svg width="0" height="0" aria-hidden="true" style="position: absolute">
            <filter
                id="liquid-glass"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%"
                color-interpolation-filters="sRGB"
            >
                <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.01 0.012"
                    numOctaves="2"
                    seed="11"
                    result="noise"
                />
                <feGaussianBlur in="noise" stdDeviation="2" result="noiseBlur" />
                <feDisplacementMap
                    in="SourceGraphic"
                    in2="noiseBlur"
                    scale="55"
                    xChannelSelector="R"
                    yChannelSelector="G"
                    result="disp"
                />
                <feGaussianBlur in="disp" stdDeviation="3" />
            </filter>
        </svg>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
